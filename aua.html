<pre id="aua"></pre>
<script type="module">
  import { AUA } from "./aua.js";
  const measure = 1; // Beispiel Masse
  const out = AUA(measure); // ein Mind
  
  let txt = "";
  txt += "RESPO AUA :: Maß-Detektor\n";
  txt += "--------------------------------\n";

  txt += `Block     → ${out.block}\n`;
  txt += `Save      → ${out.save}\n`;
  txt += `tmp       → ${out.tmp}\n`;
  txt += `Message   → ${out.msg}\n`;
  txt += "--------------------------------\n";
  txt += "NC.link aktiv\n";
  txt += "tmp-flux stabil\n";
  txt += "Masse zurück: 1 Gegenstand = 1 Mind = 1 Mark\n";

  document.getElementById("aua").textContent = txt;
</script>
